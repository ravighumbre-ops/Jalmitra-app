name: jalmitra
description: Jalmitra groundwater information and borewell guidance app
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # नकाशा
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

  # GPS लोकेशन
  geolocator: ^14.0.2

  # माहिती सेव्ह करण्यासाठी
  shared_preferences: ^2.5.3

  # इंटरनेटवरील डेटा
  http: ^1.4.0

  # अधिकृत भूजल वेबसाइट उघडण्यासाठी
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
