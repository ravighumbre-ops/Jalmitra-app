name: jalmitra
description: Jalmitra groundwater information and borewell guidance app
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # नकाशा दाखवण्यासाठी
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

  # GPS लोकेशनसाठी
  geolocator: ^14.0.2

  # वापरकर्त्याची माहिती सेव्ह करण्यासाठी
  shared_preferences: ^2.5.3

  # इंटरनेटवरून भूजल डेटा मिळवण्यासाठी
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
